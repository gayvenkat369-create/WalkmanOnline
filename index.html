<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Walkman</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--bg:#d8d3c8;--m1:#c9ced6;--m2:#9da5b0;--rim:#6f7782;--ink:#22252a;--go:#f26a1b;--key1:#4b4f56;--key2:#2a2d32;--keyink:#e6e7e9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181a;--m1:#6b727c;--m2:#454b54;--rim:#23262a;--ink:#e8eaed}}
:root[data-theme="dark"]{--bg:#17181a;--m1:#6b727c;--m2:#454b54;--rim:#23262a;--ink:#e8eaed}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,serif;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:18px 14px 28px}
.wrap{width:100%;max-width:370px}
.deck{background:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 1px,transparent 1px 3px),linear-gradient(170deg,var(--m1),var(--m2));border-radius:22px;border:1px solid var(--rim);padding:18px 18px 20px;box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 18px 28px -16px rgba(0,0,0,.6)}
.bay{aspect-ratio:1.6;background:#0d0e10;border-radius:14px;padding:10px;position:relative;overflow:hidden;box-shadow:inset 0 4px 10px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.45)}
.bay::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.12) 0 22%,transparent 22% 100%)}
.cassette{position:absolute;inset:10px;border-radius:9px;background:#2b2d31;display:flex;flex-direction:column;padding:8px 10px 10px;transition:transform .5s ease,opacity .4s;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.cassette.out{transform:translateY(34%);opacity:0}
.cassette::before,.cassette::after{content:"";position:absolute;bottom:5px;width:7px;height:7px;border-radius:50%;background:#8b9097}
.cassette::before{left:7px}.cassette::after{right:7px}
.label{height:46%;background:repeating-linear-gradient(#efe8d2 0 19px,#d9d1b8 19px 20px);border-radius:5px;border-top:7px solid var(--go);padding:2px 10px;overflow:hidden}
.ttl{font-family:Caveat,'Comic Sans MS',cursive;font-weight:600;font-size:27px;line-height:30px;color:#27315a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win{flex:1;margin:8px auto 4px;width:80%;background:#0f1012;border-radius:8px;border:2px solid #44474d;overflow:hidden}
.win svg{width:100%;height:100%;display:block}
.hub{animation:spin 1.6s linear infinite;animation-play-state:paused}
.on .hub{animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.hub{animation:none}}
.counter{margin:14px auto 0;width:150px;display:flex;justify-content:space-between;background:#101113;color:#e9e3cf;border-radius:6px;padding:4px 12px;font-family:'VT323',ui-monospace,monospace;font-size:28px;line-height:1.1;box-shadow:inset 0 2px 5px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.4)}
.stripe{height:9px;margin:16px -18px 0;background:var(--go)}
.keys{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:9px;margin-top:18px}
.k{position:relative}
button{width:100%;height:70px;border-radius:6px 6px 3px 3px;border:1px solid #14161a;background:linear-gradient(var(--key1),var(--key2));color:var(--keyink);cursor:pointer;display:grid;place-items:center;box-shadow:0 6px 0 #101215,inset 0 1px 0 rgba(255,255,255,.22);transition:transform .08s,box-shadow .08s}
button.down{transform:translateY(5px);box-shadow:0 1px 0 #101215,inset 0 2px 5px rgba(0,0,0,.6)}
button:active:not(:disabled){transform:translateY(5px);box-shadow:0 1px 0 #101215}
button.play{border-top:4px solid var(--go)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,#files:focus-visible+button{outline:3px solid var(--go);outline-offset:3px}
svg.ic{width:26px;height:26px;fill:currentColor}
#files{position:absolute;left:0;top:0;width:100%;height:70px;opacity:0;cursor:pointer;z-index:3;font-size:100px}
#files.off{display:none}
.err{font-size:14px;line-height:1.4;margin:14px 4px 0;color:var(--go)}
ol{margin:16px 0 0;padding:0 0 0 28px;font-size:15px;line-height:1.7}
ol li{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
ol li.now{font-weight:bold}
</style>
</head>
<body>
<div class="wrap">
<main class="deck">
  <div class="bay" id="bay">
    <div class="cassette out" id="cass">
      <div class="label"><div class="ttl" id="ttl"></div></div>
      <div class="win">
        <svg viewBox="0 0 200 64" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
          <path id="tape" fill="none" stroke="#4a362a" stroke-width="2"/>
          <circle id="pL" cx="55" cy="32" r="21" fill="#4a362a"/>
          <circle id="pR" cx="145" cy="32" r="11" fill="#4a362a"/>
          <g class="hub" style="transform-origin:55px 32px"><circle cx="55" cy="32" r="10" fill="#e8e6df"/><circle cx="55" cy="32" r="6.6" fill="#101113"/><g fill="#e8e6df"><rect x="54" y="25.6" width="2" height="3.6"/><rect x="54" y="25.6" width="2" height="3.6" transform="rotate(60 55 32)"/><rect x="54" y="25.6" width="2" height="3.6" transform="rotate(120 55 32)"/><rect x="54" y="25.6" width="2" height="3.6" transform="rotate(180 55 32)"/><rect x="54" y="25.6" width="2" height="3.6" transform="rotate(240 55 32)"/><rect x="54" y="25.6" width="2" height="3.6" transform="rotate(300 55 32)"/></g></g>
          <g class="hub" style="transform-origin:145px 32px"><circle cx="145" cy="32" r="10" fill="#e8e6df"/><circle cx="145" cy="32" r="6.6" fill="#101113"/><g fill="#e8e6df"><rect x="144" y="25.6" width="2" height="3.6"/><rect x="144" y="25.6" width="2" height="3.6" transform="rotate(60 145 32)"/><rect x="144" y="25.6" width="2" height="3.6" transform="rotate(120 145 32)"/><rect x="144" y="25.6" width="2" height="3.6" transform="rotate(180 145 32)"/><rect x="144" y="25.6" width="2" height="3.6" transform="rotate(240 145 32)"/><rect x="144" y="25.6" width="2" height="3.6" transform="rotate(300 145 32)"/></g></g>
        </svg>
      </div>
    </div>
  </div>
  <div class="counter" aria-live="polite"><span id="trk">--</span><span id="time">0:00</span></div>
  <div class="stripe"></div>
  <div class="keys">
    <div class="k"><button class="play" id="play" disabled aria-label="Play"><svg class="ic" viewBox="0 0 24 24"><path d="M8 5l12 7-12 7z"/></svg></button></div>
    <div class="k"><button id="stop" disabled aria-label="Stop"><svg class="ic" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1"/></svg></button></div>
    <div class="k"><input type="file" id="files" accept="audio/*" multiple aria-label="Insert tape"><button id="eject" aria-label="Open or eject"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5l8 9H4z"/><rect x="4" y="16" width="16" height="3" rx="1"/></svg></button></div>
  </div>
</main>
<p class="err" id="err" hidden></p>
<ol id="list"></ol>
</div>
<script>
(function(){
  var a=new Audio(), tracks=[], dur=[], i=0, wantPlay=false, triedData={}, last=0;
  var $=function(id){return document.getElementById(id)};
  var play=$('play'),stop=$('stop'),eject=$('eject'),files=$('files');
  var PLAY='<svg class="ic" viewBox="0 0 24 24"><path d="M8 5l12 7-12 7z"/></svg>';
  function fmt(s){s=Math.floor(s||0);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
  function name(f){return f.name.replace(/\.[^.]+$/,'')}
  function say(m){$('err').textContent=m;$('err').hidden=false}
  function progress(){
    var n=tracks.length,known=0,k,before=0,total=0;
    for(k=0;k<n;k++){if(dur[k]>0){known++;total+=dur[k];if(k<i)before+=dur[k]}}
    if(n&&known===n)return Math.min(1,(before+a.currentTime)/total);
    return dur[i]>0?Math.min(1,a.currentTime/dur[i]):0;
  }
  function reels(){
    var p=progress(),rL=11+10*(1-p),rR=11+10*p;
    $('pL').setAttribute('r',rL);$('pR').setAttribute('r',rR);
    $('tape').setAttribute('d','M'+(55-rL)+',32 L'+(55-rL)+','+(32+4)+' L'+(55)+','+(32+rL)+' L88,60 L112,60 L'+(145)+','+(32+rR)+' L'+(145+rR)+','+(32+4)+' L'+(145+rR)+',32');
  }
  function show(){
    var n=tracks.length, playing=n&&!a.paused;
    $('trk').textContent=n?String(i+1).padStart(2,'0'):'--';
    $('ttl').textContent=n?name(tracks[i].file):'';
    $('time').textContent=fmt(a.currentTime);
    var items=$('list').children;
    for(var k=0;k<items.length;k++)items[k].className=k===i?'now':'';
    play.className='play'+(playing?' down':'');
    play.setAttribute('aria-label',playing?'Pause':'Play');
    $('cass').className='cassette'+(n?'':' out')+(playing?' on':'');
    play.disabled=stop.disabled=!n;
    files.className=n?'off':'';
    reels();
  }
  a.addEventListener('error',function(){
    var t=tracks[i];
    if(t&&!triedData[i]){
      triedData[i]=true;var r=new FileReader();
      r.onload=function(){a.src=r.result;a.load();if(wantPlay)a.play().catch(function(){})};
      r.onerror=function(){say("Couldn't read this file.")};
      r.readAsDataURL(t.file);
    }else say("This file can't be played here. Try an MP3 or M4A.");
  });
  window.addEventListener('error',function(e){say('Error: '+(e.message||'unknown'))});
  function load(k){i=k;a.src=tracks[i].url;a.currentTime=0;last=0}
  function lock(){
    try{
      var ms=navigator.mediaSession;if(!ms)return;
      ['previoustrack','nexttrack','seekto','seekbackward','seekforward'].forEach(function(x){try{ms.setActionHandler(x,null)}catch(e){}});
      ms.setActionHandler('play',function(){a.play()});
      ms.setActionHandler('pause',function(){a.pause()});
      ms.metadata=new MediaMetadata({title:name(tracks[i].file),album:'Tape'});
    }catch(e){}
  }
  function ejectDisc(){
    a.pause();wantPlay=false;
    tracks.forEach(function(t){URL.revokeObjectURL(t.url)});
    tracks=[];dur=[];i=0;a.removeAttribute('src');
    $('list').innerHTML='';triedData={};show();
  }
  files.addEventListener('change',function(e){
    var fl=Array.prototype.slice.call(e.target.files).filter(function(f){return /^audio\//.test(f.type)||/\.(mp3|m4a|flac|wav|ogg|aac|opus)$/i.test(f.name)});
    if(!fl.length)return;
    fl.sort(function(x,y){return x.name.localeCompare(y.name,undefined,{numeric:true})});
    ejectDisc();
    tracks=fl.map(function(f){return{file:f,url:URL.createObjectURL(f)}});
    tracks.forEach(function(t,k){
      var li=document.createElement('li');li.textContent=name(t.file);$('list').appendChild(li);
      var m=new Audio();m.preload='metadata';m.src=t.url;
      m.addEventListener('loadedmetadata',function(){dur[k]=m.duration;reels()});
    });
    $('err').hidden=true;load(0);show();
    e.target.value='';
  });
  play.addEventListener('click',function(){
    if(!tracks.length)return;
    if(a.paused){wantPlay=true;a.play().then(lock).catch(function(){say("This file can't be played on this device.");show()})}
    else{wantPlay=false;a.pause()}
  });
  stop.addEventListener('click',function(){wantPlay=false;a.pause();load(0);show()});
  eject.addEventListener('click',function(){if(tracks.length)ejectDisc()});
  a.addEventListener('play',show);a.addEventListener('pause',show);
  a.addEventListener('ended',function(){
    if(i<tracks.length-1){load(i+1);a.play();lock()}
    else{wantPlay=false;load(0);show()}
  });
  // No scrubbing: if the position leaps, snap it back.
  a.addEventListener('timeupdate',function(){
    $('time').textContent=fmt(a.currentTime);
    if(Math.abs(a.currentTime-last)>1.5&&a.currentTime>0.5){a.currentTime=last}
    else last=a.currentTime;
    reels();
  });
  show();
})();
</script>
</body>
</html>
