<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Walkman</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2b2d31">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
@font-face{font-family:Doto;src:url(doto.woff2) format("woff2");font-weight:800;font-display:swap}
:root{--bg:#d8d3c8;--m1:#c9ced6;--m2:#9da5b0;--rim:#6f7782;--ink:#22252a;--go:#f26a1b;--key1:#4b4f56;--key2:#2a2d32;--keyink:#e6e7e9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181a;--m1:#6b727c;--m2:#454b54;--rim:#23262a;--ink:#e8eaed}}
:root[data-theme="dark"]{--bg:#17181a;--m1:#6b727c;--m2:#454b54;--rim:#23262a;--ink:#e8eaed}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,serif;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:18px 14px 28px}
.wrap{width:100%;max-width:370px}
.deck{background:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 1px,transparent 1px 3px),linear-gradient(170deg,var(--m1),var(--m2));border-radius:22px;border:1px solid var(--rim);padding:18px 18px 20px;box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 18px 28px -16px rgba(0,0,0,.6)}
.bay{aspect-ratio:1.6;background:#0d0e10;border-radius:14px;padding:10px;position:relative;overflow:hidden;box-shadow:inset 0 4px 10px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.45)}
.bay::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.12) 0 22%,transparent 22% 100%)}
.cassette{position:absolute;inset:10px;border-radius:9px;background:#2b2d31;display:flex;flex-direction:column;padding:8px 10px 10px;transition:transform .5s ease,opacity .4s;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.bay img{position:absolute;left:50%;top:50%;width:36%;max-width:130px;transform:translate(-50%,-50%);border-radius:20px;transition:opacity .3s;opacity:1}
.cassette.out{transform:translateY(34%);opacity:0}
.cassette::before,.cassette::after{content:"";position:absolute;bottom:5px;width:7px;height:7px;border-radius:50%;background:#8b9097}
.cassette::before{left:7px}.cassette::after{right:7px}
.label{height:46%;background:repeating-linear-gradient(#efe8d2 0 19px,#d9d1b8 19px 20px);border-radius:5px;border-top:7px solid var(--go);padding:2px 10px;overflow:hidden}
.ttl{font-family:Doto,ui-monospace,monospace;font-weight:800;font-size:13px;line-height:20px;color:#27315a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl.sub{font-size:11px;opacity:.75}
.win{flex:1;margin:8px auto 4px;width:80%;background:#0f1012;border-radius:8px;border:2px solid #44474d;overflow:hidden}
.win svg{width:100%;height:100%;display:block}
.hub{animation:spin 1.6s linear infinite;animation-play-state:paused}
.on .hub{animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.hub{animation:none}}
.panel{margin:14px 0 0;display:flex;gap:12px;background:#0f1012;border-radius:8px;padding:10px;box-shadow:inset 0 2px 5px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.4);color:#ffb23e;font-family:Doto,ui-monospace,monospace;font-weight:800}
.cover{width:96px;height:96px;flex:none;border-radius:4px;background:#1b1c1f center/cover no-repeat;box-shadow:0 0 0 1px #2b2d31;position:relative;overflow:hidden}
.cover.none{background-image:radial-gradient(circle,#3a3c41 1.4px,transparent 1.6px);background-size:8px 8px}
.info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between;text-shadow:0 0 6px rgba(255,178,62,.45)}
.top{display:flex;justify-content:space-between;font-size:15px;letter-spacing:.08em}
.name{font-size:16px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.clock{font-size:30px;line-height:1;letter-spacing:.04em}
.stripe{height:9px;margin:16px -18px 0;background:var(--go)}
.keys{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:9px;margin-top:18px}
.k{position:relative}
button{width:100%;height:70px;border-radius:6px 6px 3px 3px;border:1px solid #14161a;background:linear-gradient(var(--key1),var(--key2));color:var(--keyink);cursor:pointer;display:grid;place-items:center;box-shadow:0 6px 0 #101215,inset 0 1px 0 rgba(255,255,255,.22);transition:transform .08s,box-shadow .08s}
button.down{transform:translateY(5px);box-shadow:0 1px 0 #101215,inset 0 2px 5px rgba(0,0,0,.6)}
button:active:not(:disabled){transform:translateY(5px);box-shadow:0 1px 0 #101215}
button.play{border-top:4px solid var(--go)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,#files:focus-visible+button{outline:3px solid var(--go);outline-offset:3px}
svg.ic{width:26px;height:26px;fill:currentColor}
#files{position:absolute;left:0;top:0;width:100%;height:70px;opacity:0;cursor:pointer;z-index:3;font-size:100px}
#files.off{display:none}
.err{font-size:14px;line-height:1.4;margin:14px 4px 0;color:var(--go)}
ol{margin:16px 0 0;padding:0 0 0 28px;font-size:15px;line-height:1.7}
ol li{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
ol li.now{font-weight:bold}
</style>
</head>
<body>
<div class="wrap">
<main class="deck">
  <div class="bay" id="bay">
    <img id="ico" src="icon-192.png" alt="">
    <div class="cassette out" id="cass">
      <div class="label"><div class="ttl" id="alb"></div><div class="ttl sub" id="art"></div></div>
      <div class="win">
        <svg viewBox="0 0 200 64" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
          <path id="tape" fill="none" stroke="#4a362a" stroke-width="2"/>
          <circle id="pL" cx="55" cy="32" r="21" fill="#4a362a"/>
          <circle id="pR" cx="145" cy="32" r="11" fill="#4a362a"/>
          <g class="hub" style="transform-origin:55px 32px"><circle cx="55" cy="32" r="10" fill="#e8e6df"/><circle cx="55" cy="32" r="6.6" fill="#101113"/><g fill="#e8e6df"><rect x="54" y="25.6" width="2" height="3.6"/><rect x="54" y="25.6" width="2" height="3.6" transform="rotate(60 55 32)"/><rect x="54" y="25.6" width="2" height="3.6" transform="rotate(120 55 32)"/><rect x="54" y="25.6" width="2" height="3.6" transform="rotate(180 55 32)"/><rect x="54" y="25.6" width="2" height="3.6" transform="rotate(240 55 32)"/><rect x="54" y="25.6" width="2" height="3.6" transform="rotate(300 55 32)"/></g></g>
          <g class="hub" style="transform-origin:145px 32px"><circle cx="145" cy="32" r="10" fill="#e8e6df"/><circle cx="145" cy="32" r="6.6" fill="#101113"/><g fill="#e8e6df"><rect x="144" y="25.6" width="2" height="3.6"/><rect x="144" y="25.6" width="2" height="3.6" transform="rotate(60 145 32)"/><rect x="144" y="25.6" width="2" height="3.6" transform="rotate(120 145 32)"/><rect x="144" y="25.6" width="2" height="3.6" transform="rotate(180 145 32)"/><rect x="144" y="25.6" width="2" height="3.6" transform="rotate(240 145 32)"/><rect x="144" y="25.6" width="2" height="3.6" transform="rotate(300 145 32)"/></g></g>
        </svg>
      </div>
    </div>
  </div>
  <div class="panel" aria-live="polite">
    <div class="cover none" id="cover"></div>
    <div class="info"><div class="top"><span id="trk">--</span></div><div class="name" id="ttl"></div><div class="clock" id="time">0:00</div></div>
  </div>
  <div class="stripe"></div>
  <div class="keys">
    <div class="k"><button class="play" id="play" disabled aria-label="Play"><svg class="ic" viewBox="0 0 24 24"><path d="M8 5l12 7-12 7z"/></svg></button></div>
    <div class="k"><button id="stop" disabled aria-label="Stop"><svg class="ic" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1"/></svg></button></div>
    <div class="k"><input type="file" id="files" multiple aria-label="Insert tape: pick audio files and an optional album.nfo"><button id="eject" aria-label="Open or eject"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5l8 9H4z"/><rect x="4" y="16" width="16" height="3" rx="1"/></svg></button></div>
  </div>
</main>
<p class="err" id="err" hidden></p>
<ol id="list"></ol>
</div>
<script src="jsmediatags.min.js"></script>
<script>
(function(){
  var a=new Audio(), tracks=[], i=0, wantPlay=false, triedData={}, last=0, busy=false, coverShown='';
  var $=function(id){return document.getElementById(id)};
  var play=$('play'),stop=$('stop'),eject=$('eject'),files=$('files');
  function fmt(s){s=Math.floor(s||0);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
  function name(f){return f.name.replace(/\.[^.]+$/,'')}
  function title(t){return (t.meta&&t.meta.title)||name(t.file)}
  function say(m){$('err').textContent=m;$('err').hidden=false}
  function setCover(url){var c=$('cover');if(url){c.style.backgroundImage='url("'+url+'")';c.className='cover'}else{c.style.backgroundImage='';c.className='cover none'}}
  function currentCover(){
    var t=tracks[i];if(t&&t.meta&&t.meta.cover)return t.meta.cover;
    for(var k=0;k<tracks.length;k++)if(tracks[k].meta&&tracks[k].meta.cover)return tracks[k].meta.cover;
    return '';
  }
  function renderList(){
    var ol=$('list');ol.innerHTML='';
    tracks.forEach(function(t){var li=document.createElement('li');li.textContent=title(t);ol.appendChild(li)});
  }
  function readTags(t){
    return new Promise(function(res){
      if(!window.jsmediatags)return res();
      window.jsmediatags.read(t.file,{
        onSuccess:function(r){
          var g=r.tags||{},m={title:g.title,artist:g.artist,album:g.album};
          if(g.picture&&g.picture.data){try{m.cover=URL.createObjectURL(new Blob([new Uint8Array(g.picture.data)],{type:g.picture.format||'image/jpeg'}))}catch(e){}}
          t.meta=m;res();
        },
        onError:function(){res()}
      });
    });
  }
  function progress(){
    var n=tracks.length,known=0,k,before=0,total=0;
    for(k=0;k<n;k++){if(tracks[k].dur>0){known++;total+=tracks[k].dur;if(k<i)before+=tracks[k].dur}}
    if(n&&known===n)return Math.min(1,(before+a.currentTime)/total);
    return n&&tracks[i].dur>0?Math.min(1,a.currentTime/tracks[i].dur):0;
  }
  function reels(){
    var p=progress(),rL=11+10*(1-p),rR=11+10*p;
    $('pL').setAttribute('r',rL);$('pR').setAttribute('r',rR);
    $('tape').setAttribute('d','M'+(55-rL)+',32 L'+(55-rL)+',36 L55,'+(32+rL)+' L88,60 L112,60 L145,'+(32+rR)+' L'+(145+rR)+',36 L'+(145+rR)+',32');
  }
  function show(){
    var n=tracks.length, playing=n&&!a.paused, t=n?tracks[i]:null, m=(t&&t.meta)||{};
    $('trk').textContent=n?String(i+1).padStart(2,'0'):'--';
    $('ttl').textContent=t?title(t):'';
    $('alb').textContent=m.album||'';$('art').textContent=m.artist||'';
    var cu=n?currentCover():'';if(cu!==coverShown){coverShown=cu;setCover(cu)}
    $('time').textContent=fmt(a.currentTime);
    var items=$('list').children;
    for(var k=0;k<items.length;k++)items[k].className=k===i?'now':'';
    play.className='play'+(playing?' down':'');
    play.setAttribute('aria-label',playing?'Pause':'Play');
    $('cass').className='cassette'+(n?'':' out')+(playing?' on':'');
    play.disabled=!n||busy;stop.disabled=!n;
    files.className=n?'off':'';
    reels();
  }
  a.addEventListener('error',function(){
    var t=tracks[i];
    if(t&&!triedData[i]){
      triedData[i]=true;var r=new FileReader();
      r.onload=function(){a.src=r.result;a.load();if(wantPlay)a.play().catch(function(){})};
      r.onerror=function(){say("Couldn't read this file.")};
      r.readAsDataURL(t.file);
    }else say("This file can't be played here. Try an MP3 or M4A.");
  });
  window.addEventListener('error',function(e){say('Error: '+(e.message||'unknown'))});
  function load(k){i=k;a.src=tracks[i].url;a.currentTime=0;last=0}
  function lock(){
    try{
      var ms=navigator.mediaSession;if(!ms)return;
      ['previoustrack','nexttrack','seekto','seekbackward','seekforward'].forEach(function(x){try{ms.setActionHandler(x,null)}catch(e){}});
      ms.setActionHandler('play',function(){a.play()});
      ms.setActionHandler('pause',function(){a.pause()});
      var t=tracks[i],mm=t.meta||{};
      ms.metadata=new MediaMetadata({title:title(t),artist:mm.artist||'',album:mm.album||'Tape',artwork:currentCover()?[{src:currentCover()}]:[]});
    }catch(e){}
  }
  function ejectDisc(){
    a.pause();wantPlay=false;busy=false;
    tracks.forEach(function(t){URL.revokeObjectURL(t.url);if(t.meta&&t.meta.cover)URL.revokeObjectURL(t.meta.cover)});
    tracks=[];i=0;coverShown='';a.removeAttribute('src');
    $('list').innerHTML='';triedData={};show();
  }

  /* ---- album.nfo: read the track list and use it for play order ---- */
  function norm(s){return (s||'').toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/&/g,'and').replace(/[^a-z0-9]+/g,'')}
  function stripNum(s){return s.replace(/^\s*[\[(]?\d{1,3}[\])]?\s*[.\-:)_]*\s*/,'')}
  function parseNfo(text){
    var out=[];
    if(/<\s*(album|track)\b/i.test(text)){
      try{
        var doc=new DOMParser().parseFromString(text,'text/xml');
        if(!doc.querySelector('parsererror')){
          doc.querySelectorAll('track').forEach(function(tr,idx){
            var p=tr.querySelector('position'),tt=tr.querySelector('title');
            if(tt&&tt.textContent.trim())out.push({pos:(p&&parseInt(p.textContent,10))||idx+1,title:tt.textContent.trim()});
          });
          if(out.length)return out;
        }
      }catch(e){}
    }
    var disc=0;
    text.split(/\r?\n/).forEach(function(line){
      var d=/^\s*(?:disc|disk|cd)\s*(\d+)/i.exec(line);
      if(d){disc=parseInt(d[1],10);return}
      var m=/^\s*[\[(]?(\d{1,3})[\])]?(?:\s*[.\-:)]\s*|\s+)(.+?)\s*$/.exec(line);
      if(!m)return;
      var t=m[2].replace(/\s*[\[(]?\d{1,2}:\d{2}[\])]?\s*$/,'').trim();
      if(t.length<2||!/[a-z]/i.test(t))return;
      out.push({pos:disc*1000+parseInt(m[1],10),title:t});
    });
    return out;
  }
  function applyNfo(entries){
    var cands=[];
    tracks.forEach(function(t,ti){
      var nf=norm(t.meta&&t.meta.title),nn=norm(stripNum(name(t.file)));
      entries.forEach(function(e,ei){
        var vs=[norm(e.title)];
        if(e.title.indexOf(' - ')>-1)vs.push(norm(e.title.split(' - ').slice(1).join(' - ')));
        var best=0,blen=0;
        vs.forEach(function(en){
          if(en.length<2)return;
          var sc=0;
          if(nf===en||nn===en)sc=3;
          else if(en.length>=3&&((nf.length>=3&&(nf.indexOf(en)>-1||en.indexOf(nf)>-1))||(nn.length>=3&&(nn.indexOf(en)>-1||en.indexOf(nn)>-1))))sc=2;
          if(sc>best||(sc===best&&sc&&en.length>blen)){best=sc;blen=en.length}
        });
        if(best)cands.push({ti:ti,ei:ei,sc:best,len:blen});
      });
    });
    cands.sort(function(x,y){return y.sc-x.sc||y.len-x.len});
    var usedT={},usedE={},matched=0;
    cands.forEach(function(c){
      if(usedT[c.ti]||usedE[c.ei])return;
      usedT[c.ti]=usedE[c.ei]=1;tracks[c.ti].key=entries[c.ei].pos;matched++;
    });
    tracks.forEach(function(t,ti){if(!usedT[ti])t.key=1e6+ti});
    tracks.sort(function(x,y){return x.key-y.key});
    return matched;
  }

  files.addEventListener('change',function(e){
    var all=Array.prototype.slice.call(e.target.files);e.target.value='';
    var isNfo=function(f){return /\.nfo$/i.test(f.name)};
    var nfos=all.filter(isNfo);
    var nfoFile=nfos.filter(function(f){return /^album\.nfo$/i.test(f.name)})[0]||nfos[0];
    var audio=all.filter(function(f){return !isNfo(f)&&(/^audio\//.test(f.type)||/\.(mp3|m4a|flac|wav|ogg|aac|opus)$/i.test(f.name))});
    if(!audio.length){if(all.length)say('No audio files found in that selection.');return}
    audio.sort(function(x,y){return x.name.localeCompare(y.name,undefined,{numeric:true})});
    ejectDisc();
    tracks=audio.map(function(f){return{file:f,url:URL.createObjectURL(f),meta:null,dur:0,key:0}});
    $('err').hidden=true;busy=!!nfoFile;
    renderList();
    tracks.forEach(function(t){
      var m=new Audio();m.preload='metadata';m.src=t.url;
      m.addEventListener('loadedmetadata',function(){t.dur=m.duration;reels()});
    });
    var tagJobs=tracks.map(function(t){return readTags(t).then(function(){renderList();show()})});
    load(0);show();
    if(nfoFile){
      var wait=new Promise(function(r){setTimeout(r,4000)});
      Promise.race([Promise.all(tagJobs),wait])
        .then(function(){return nfoFile.text()})
        .then(function(txt){
          var entries=parseNfo(txt);
          if(!entries.length){say("Couldn't find a track list in "+nfoFile.name+'. Using file-name order.');return}
          var n=applyNfo(entries);
          if(!n)say("Couldn't match any tracks to "+nfoFile.name+'. Using file-name order.');
          else if(n<tracks.length)say('Placed '+n+' of '+tracks.length+' tracks using '+nfoFile.name+'. The rest follow in file-name order.');
        })
        .catch(function(){say("Couldn't read "+nfoFile.name+'. Using file-name order.')})
        .then(function(){busy=false;triedData={};renderList();load(0);show()});
    }
  });

  play.addEventListener('click',function(){
    if(!tracks.length||busy)return;
    if(a.paused){wantPlay=true;a.play().then(lock).catch(function(){say("This file can't be played on this device.");show()})}
    else{wantPlay=false;a.pause()}
  });
  stop.addEventListener('click',function(){wantPlay=false;a.pause();load(0);show()});
  eject.addEventListener('click',function(){if(tracks.length)ejectDisc()});
  a.addEventListener('play',show);a.addEventListener('pause',show);
  a.addEventListener('ended',function(){
    if(i<tracks.length-1){load(i+1);a.play();lock()}
    else{wantPlay=false;load(0);show()}
  });
  // No scrubbing: if the position leaps, snap it back.
  a.addEventListener('timeupdate',function(){
    $('time').textContent=fmt(a.currentTime);
    if(Math.abs(a.currentTime-last)>1.5&&a.currentTime>0.5){a.currentTime=last}
    else last=a.currentTime;
    reels();
  });
  show();
})();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}</script>
</body>
</html>
